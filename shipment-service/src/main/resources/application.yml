server:
  port: 5002
spring:
  application:
    name: shipment-service
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shipment_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:courier}
    password: ${DB_PASSWORD:courier_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:courier}
    password: ${RABBITMQ_PASSWORD:courier_dev_only}
    connection-timeout: 5s
    dynamic: true
    template:
      retry:
        enabled: true
        initial-interval: 500ms
        max-attempts: 3
        multiplier: 2.0
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          user-service:
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
resilience4j:
  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 300ms
        retryExceptions:
          - com.courier.shipment.client.UserServiceUnavailableException
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
springdoc:
  swagger-ui:
    path: /swagger-ui.html
