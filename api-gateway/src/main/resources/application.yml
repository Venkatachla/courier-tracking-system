server:
  port: 8080
spring:
  application:
    name: api-gateway
  profiles:
    default: dev
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-service:5001}
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: shipment-service
          uri: ${SHIPMENT_SERVICE_URL:http://shipment-service:5002}
          predicates:
            - Path=/api/shipments/**
        - id: tracking-service
          uri: ${TRACKING_SERVICE_URL:http://tracking-service:5003}
          predicates:
            - Path=/api/tracking/**,/api/track/**
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET:local_dev_secret_change_me_32_chars_minimum}
gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    general-limit: ${RATE_LIMIT_GENERAL:120}
    auth-limit: ${RATE_LIMIT_AUTH:10}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
