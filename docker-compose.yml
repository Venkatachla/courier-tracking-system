services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
      MYSQL_DATABASE: user_db
      MYSQL_USER: ${DB_USER:-courier}
      MYSQL_PASSWORD: ${DB_PASSWORD:-courier_dev_only}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/mysql/02-grant-service-databases.sh:/docker-entrypoint-initdb.d/02-grant-service-databases.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [courier]

  rabbitmq:
    image: rabbitmq:4-management
    profiles: ["docker-broker"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-courier}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-courier_dev_only}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [courier]

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_NAME: user_db
      DB_USER: ${DB_USER:-courier}
      DB_PASSWORD: ${DB_PASSWORD:-courier_dev_only}
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_change_me_32_chars_minimum}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      mysql: { condition: service_healthy }
    expose: ["5001"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5001'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [courier]

  shipment-service:
    build:
      context: .
      dockerfile: shipment-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_NAME: shipment_db
      DB_USER: ${DB_USER:-courier}
      DB_PASSWORD: ${DB_PASSWORD:-courier_dev_only}
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_change_me_32_chars_minimum}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-courier}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-courier_dev_only}
      USER_SERVICE_URL: http://user-service:5001
    depends_on:
      mysql: { condition: service_healthy }
      user-service: { condition: service_healthy }
    expose: ["5002"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5002'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [courier]

  tracking-service:
    build:
      context: .
      dockerfile: tracking-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_NAME: tracking_db
      DB_USER: ${DB_USER:-courier}
      DB_PASSWORD: ${DB_PASSWORD:-courier_dev_only}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-courier}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-courier_dev_only}
      SHIPMENT_SERVICE_URL: ${SHIPMENT_SERVICE_URL:-http://shipment-service:5002}
    depends_on:
      mysql: { condition: service_healthy }
      shipment-service: { condition: service_healthy }
    expose: ["5003"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5003'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [courier]

  gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_change_me_32_chars_minimum}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:5001}
      SHIPMENT_SERVICE_URL: ${SHIPMENT_SERVICE_URL:-http://shipment-service:5002}
      TRACKING_SERVICE_URL: ${TRACKING_SERVICE_URL:-http://tracking-service:5003}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      RATE_LIMIT_GENERAL: ${RATE_LIMIT_GENERAL:-120}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      user-service: { condition: service_healthy }
      shipment-service: { condition: service_healthy }
      tracking-service: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [courier]

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on: [gateway]
    ports: ["3000:80"]
    networks: [courier]

volumes:
  mysql_data:

networks:
  courier:
    driver: bridge
