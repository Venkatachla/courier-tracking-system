server:
  port: 5001
spring:
  application:
    name: user-service
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:user_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:courier}
    password: ${DB_PASSWORD:courier_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET:local_dev_secret_change_me_32_chars_minimum}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
