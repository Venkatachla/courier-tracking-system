server:
  port: 5003
spring:
  application:
    name: tracking-service
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tracking_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:courier}
    password: ${DB_PASSWORD:courier_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:courier}
    password: ${RABBITMQ_PASSWORD:courier_dev_only}
    connection-timeout: 5s
    dynamic: true
    listener:
      simple:
        missing-queues-fatal: false
        recovery-interval: 5s
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          shipment-service:
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
resilience4j:
  retry:
    instances:
      shipmentService:
        maxAttempts: 3
        waitDuration: 300ms
        retryExceptions:
          - com.courier.tracking.client.ShipmentServiceUnavailableException
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
springdoc:
  swagger-ui:
    path: /swagger-ui.html
